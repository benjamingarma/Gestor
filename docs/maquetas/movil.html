<!doctype html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="base.css">
<style>
body{padding:28px;background:#9aa5a0}
@media (prefers-color-scheme: dark){body{background:#050706}}
.hoja{display:flex;gap:28px;align-items:flex-start}
.marco{display:flex;flex-direction:column;gap:10px;align-items:center}
.rotulo{font:700 15px system-ui;color:#fff;letter-spacing:.02em}
.telefono{width:390px;height:844px;border-radius:44px;overflow:hidden;position:relative;background:var(--fondo);box-shadow:0 0 0 10px #111,0 20px 50px rgba(0,0,0,.35)}
.estado{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 28px;font:600 14px system-ui}
.pantalla{position:absolute;inset:44px 0 0 0;display:flex;flex-direction:column;overflow:hidden}
.cab{background:var(--cabecera);color:var(--cabecera-texto);padding:10px 18px 44px}
.cab .logo{background:var(--cabecera-texto);color:var(--cabecera)}
.sup{padding:8px 18px 12px}
.cuerpo{padding:0 16px 120px;overflow:hidden}
.barra{position:absolute;z-index:2;left:0;right:0;bottom:0;height:84px;background:var(--superficie);border-top:1px solid var(--borde);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px 22px}
.nav-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.68rem;font-weight:600;color:var(--texto-suave)}
.nav-item.act{color:var(--acento)}
.nav-item.act svg{stroke-width:2.4}
.nav-vender{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.68rem;font-weight:800;color:var(--acento);margin-top:-26px}
.nav-vender .bola{width:58px;height:58px;border-radius:50%;background:var(--acento);color:var(--acento-texto);display:grid;place-items:center;box-shadow:0 0 0 5px var(--superficie),0 6px 16px rgba(15,109,92,.35)}
.nav-vender .bola svg{width:30px;height:30px;stroke-width:2.6}
.pie{position:absolute;left:0;right:0;bottom:0;background:var(--superficie);border-top:1px solid var(--borde);padding:14px 16px 30px}
.check{width:88px;height:88px;border-radius:50%;background:var(--acento);color:var(--acento-texto);display:grid;place-items:center;box-shadow:0 0 0 12px var(--acento-suave)}
.cursor{display:inline-block;width:3px;height:2.1rem;background:var(--acento);margin-left:4px;vertical-align:-4px;border-radius:2px}
</style></head><body><div class="hoja" id="hoja"></div>
<script src="pantallas.js"></script>
<script>
const tit={inicio:"1 · Inicio (pantalla completa, con scroll)",venta:"2 · Venta (una pantalla)","cobro-lista":"3a · Cobrar: elegir cliente",cobro:"3b · Cobro (una pantalla)",guardado:"4 · Confirmación al guardar",mas:"5 · Más"};
const sel=(new URLSearchParams(location.search).get("p")||Object.keys(tit).join(",")).split(",");
document.getElementById("hoja").innerHTML=sel.map(k=>`<div class="marco"><span class="rotulo">${tit[k]}</span><div class="telefono" style="${k==="inicio"?"height:1240px":""}"><div class="estado"><span>9:41</span><span>●●● ▮</span></div>${MOVIL[k]()}</div></div>`).join("");
</script></body></html>
